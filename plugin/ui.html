<!DOCTYPE html>
<html>
  <head>
    <style>
      /* CSS Variables for consistent values */
      :root {
        /* Brand Colors */
        --color-primary: #E4003D;
        --color-primary-dark: #C9003A;
        --color-accent: #9B51E0;
        
        /* Text Colors */
        --color-text-primary: #333;
        --color-text-secondary: #666;
        
        /* UI Colors */
        --color-border: #C7D0D4;
        --color-background: white;
        --color-hover: rgba(0, 0, 0, 0.06);
        
        /* Score Colors */
        --color-score-red: #E4003D;
        --color-score-amber: orange;
        --color-score-green: green;
        
        /* Spacing */
        --spacing-xs: 4px;
        --spacing-sm: 6px;
        --spacing-md: 8px;
        --spacing-lg: 12px;
        --spacing-xl: 16px;
        
        /* Sizes */
        --icon-size: 28px;
        --border-radius: 4px;
        --border-radius-large: 8px;
        
        /* Z-indices */
        --z-index-normal: 1;
        --z-index-dropdown: 100;
        --z-index-modal: 1000;
        
        /* Timing */
        --timing-short: 100ms;
        --timing-standard: 300ms;
        --timing-long: 1000ms;
      }
      
      /* Layout and General Styles */
      body {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        padding: var(--spacing-xs) var(--spacing-xs) 40px var(--spacing-xs);
        background-color: var(--color-background);
        font-size: 12px;
        display: flex;
        flex-direction: column;
        gap: var(--spacing-md);
        position: relative;
      }

      /* Search filter and settings section */
      .filter-section {
        position: relative;
        display: flex;
        align-items: center;
        gap: var(--spacing-md);
      }

      /* Error message styles */
      .error-message {
        padding: var(--spacing-xl);
        margin: var(--spacing-xl);
        border-radius: var(--border-radius-large);
        background-color: var(--color-background);
        border: 1px solid var(--color-primary);
        color: var(--color-text-primary);
        text-align: center;
      }
      
      .error-message h3 {
        color: var(--color-primary);
        margin-top: 0;
      }
      
      .error-message .primary-button {
        background-color: var(--color-primary);
        color: var(--color-background);
        border: none;
        padding: var(--spacing-md) var(--spacing-xl);
        border-radius: var(--border-radius);
        cursor: pointer;
        font-weight: 500;
        margin-top: var(--spacing-lg);
      }
      
      .error-message .primary-button:hover {
        background-color: var(--color-primary-dark);
      }
      
      /* Filter input styles */
      .filter-input {
        display: none;
        width: 100%;
        padding: var(--spacing-sm) var(--spacing-md);
        border: 1px solid var(--color-border);
        border-radius: var(--border-radius);
        font-size: 12px;
        background-color: var(--color-background);
      }
      .filter-input:focus {
        outline: none;
        border-color: var(--color-accent); /* Match component title color */
      }

      /* Button Styles */
      .settings-button {
        width: var(--icon-size);
        height: var(--icon-size);
        padding: var(--spacing-sm);
        border: none;
        background: none;
        cursor: pointer;
        color: var(--color-text-secondary);
        border-radius: 999px;
      }

      .settings-button:hover {
        background-color: var(--color-hover);
      }

      .button-group {
        display: flex;
        gap: var(--spacing-md);
        align-items: center;
      }

      #refresh-button {
        width: var(--icon-size);
        height: var(--icon-size);
        padding: var(--spacing-sm);
      }

      #refresh-button svg {
        width: 16px;
        height: 16px;
      }

      #refresh-button.spin svg {
        animation: spin 1s linear infinite;
      }

      @keyframes spin {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }

      #feedback-link {
        width: auto !important;
        height: auto !important;
        padding: 4px 8px !important;
        text-decoration: none !important;
      }

      /* Component List Styles */
      .component-section {
        margin-bottom: 4px;
        padding: 2px 0;
        border-radius: 4px;
        transition: background-color 0.2s ease;
      }
      .component-section.selected {
        background-color: #E8F4FE !important;
      }

      /* Component Title Bar Styles */
      .component-title {
        font-size: 12px;
        font-weight: normal;
        margin-bottom: 4px;
        cursor: pointer; /* Entire title is clickable */
        color: #9B51E0;
        display: flex;
        align-items: center;
        height: 18px;
        gap: 4px;
        padding-right: 8px;
      }

      .component-section.selected .component-title {
        color: #7C3DDD;
        font-weight: bold;
      }

      /* Expand/Collapse Arrow Styles */
      .component-expand {
        cursor: pointer;
        padding: 4px;
        color: #888;
        font-size: 8px;
        width: 16px;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      /* Category Title Styles */
      .category-title {
        font-weight: 400;
        margin-top: 8px;
        margin-bottom: 8px;
        color: #767676;
        font-size: 13px;
      }

      /* Checkbox Styles */
      .checkbox-timestamp, .last-modified {
        color: #888;
        font-size: 10px;
        margin-left: 8px;
      }

      .modified-indicator {
        display: none; /* Hide the indicator but keep the style for future use */
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background-color: #FF4058;
        flex-shrink: 0;
        margin-right: 4px;
      }

      .last-modified {
        display: none; /* Hide the date but keep tracking it */
        font-weight: normal;
      }

      .checkbox-label {
        display: flex;
        align-items: center;
        gap: 4px;
        padding: 6px 6px;
        margin: 0 -12px;
        border-radius: 4px;
        cursor: default;
      }
      
      /* Footer styles */
      .footer {
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        padding: 8px 12px;
        background-color: #f8f9fa;
        border-top: 1px solid #e6e7e8;
        display: flex;
        align-items: center;
        justify-content: space-between;
        z-index: var(--z-index-dropdown);
      }
      
      .footer-left {
        display: flex;
        align-items: center;
      }
      
      .footer-right {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      
      .footer-checkbox {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 12px;
        color: #616e73;
        cursor: pointer;
      }
      
      .footer-checkbox input[type="checkbox"] {
        margin: 0;
      }

      .checkbox-label:hover {
        background-color: #C4E2FC;
      }

      /* Custom Rules Section Styles */
      .custom-heading {
        font-size: 12px;
        font-weight: bold;
        margin-bottom: 10px;
        color: black;
      }

      /* Score styles */
      .score-red {
        color: var(--color-score-red);      /* 0-33% complete */
      }
      
      .score-amber {
        color: var(--color-score-amber);   /* 34-66% complete */
      }
      
      .score-green {
        color: var(--color-score-green);    /* 67-100% complete */
      }

      /* Checkbox Group Styles */
      .checkbox-group {
        margin-left: 16px;      /* Indent from title */
        margin-bottom: 8px;      /* Space between categories */
      }
      .checkbox-group label {
        font-size: 12px;
        line-height: 16px;       /* Tight line spacing within items */
        display: flex;
        align-items: flex-start;  /* Align checkbox with first line */
        gap: 6px;               /* Space between checkbox and text */
        margin-bottom: 6px;    /* Space between items */
      }
      .checkbox-group label:last-child {
        margin-bottom: 0;        /* Remove extra space after last item */
      }
      
      .checkbox-group input[type="checkbox"] {
        margin: 0;
      }

      /* Settings Dropdown Styles */
      .settings-dropdown {
        position: fixed;
        bottom: 48px;
        right: 8px;
        margin-top: 4px;
        background: white;
        border: 1px solid #C7D0D4;
        border-radius: 6px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
        z-index: var(--z-index-modal);
        min-width: 220px;
        display: none;
      }

      .settings-dropdown.visible {
        display: block;
      }

      .settings-section {
        padding: 8px;
        border-bottom: 1px solid #E6E7E8;
      }

      .settings-section:last-child {
        border-bottom: none;
      }

      .settings-section-title {
        color: #666;
        font-size: 11px;
        font-weight: 500;
        text-transform: uppercase;
        margin-bottom: 8px;
      }

      .download-button, .bug-report-link {
        display: flex;
        align-items: center;
        gap: 8px;
        width: 100%;
        padding: 6px 8px;
        border: none;
        background: none;
        color: #333;
        font-size: 12px;
        text-align: left;
        cursor: pointer;
        text-decoration: none;
        border-radius: 4px;
      }

      .download-button:hover, .bug-report-link:hover {
        background-color: #f5f5f5;
      }

      .download-button svg, .bug-report-link svg {
        width: 16px;
        height: 16px;
        flex-shrink: 0;
      }

      /* Utility Classes */
      .hidden {
        display: none;
      }

      /* Custom Rules Textarea Styles */
      #textarea-container {
        margin-top: 20px;
      }
      textarea {
        width: 100%;
        height: 200px;
        font-size: 12px;
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        padding: 8px;
        border: 1px solid #C7D0D4;
        border-radius: 4px;
      }
      textarea:focus {
        outline: none;
        border-color: #9B51E0;
      }

      /* Context Menu Styles */
      .context-menu {
        position: fixed;
        background: white;
        border: 1px solid #C7D0D4;
        border-radius: 6px;
        padding: 4px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
        z-index: var(--z-index-modal);
        font-size: 12px;
      }

      .context-menu-item {
        padding: 6px 12px;
        cursor: pointer;
        border-radius: 4px;
        color: #333;
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .context-menu-item:hover {
        background-color: #f5f5f5;
      }

      .component-usage {
        color: #7B858A;
        font-size: 12px;
        margin-left: 8px;
        cursor: pointer;
        padding: 2px 8px;
        border-radius: 4px;
      }

      .component-usage:hover {
        background: #F3DAF4;
        color: #37006E;
      }

      /* Component Count Styles */
      .component-count-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        background: white;
        padding: 8px;
        border-top: 1px solid #E6E7E8;
        z-index: var(--z-index-dropdown);
      }

      .component-count {
        color: #666;
        font-size: 12px;
      }

      .settings-button svg {
        width: 16px;
        height: 16px;
      }

      /* Hide certain elements */
      .component-name .score-red,
      .component-name .score-orange,
      .component-name .score-green {
        display: none !important;
      }
      .component-name .component-usage {
        display: none !important;
      }
      #component-count {
        visibility: hidden;
      }
      #settings-dropdown .settings-section:nth-child(1) {
        display: none !important;
      }
    </style>
    <!-- Message handler is included directly in this file -->
  </head>
  <body>
    <script>
      // JavaScript Constants
      const SCORE_THRESHOLDS = {
        LOW: 33,
        MEDIUM: 66,
        HIGH: 100
      };
      
      const TIMING = {
        SHORT_DELAY: 100,
        STANDARD_DELAY: 300,
        LONG_DELAY: 1000
      };
    </script>
    <!-- Context menu -->
    <div id="context-menu" class="context-menu" style="display: none;" role="menu" aria-label="Checkbox options">
      <div class="context-menu-item" id="apply-to-all" role="menuitem" tabindex="0">
        Apply to all components
      </div>
    </div>
    <!-- Component count and settings row -->
    <div class="component-count-row">
      <span id="component-count">No components need checking</span>
      <div class="button-group">
        <button class="settings-button" id="refresh-button" title="Refresh component list">
          <svg viewBox="0 0 16 16" fill="currentColor">
            <path d="M8 3a5 5 0 11-4.546 2.914.5.5 0 01-.908-.417A6 6 0 108 2v1z"/>
            <path d="M8 4.466V.534a.25.25 0 00-.41-.192L5.23 2.308a.25.25 0 000 .384l2.36 1.966A.25.25 0 008 4.466z"/>
          </svg>
        </button>
        <a href="https://github.com/dannyhope/Component-scorecard/issues" target="_blank" class="settings-button" id="feedback-link" title="Submit Feedback">Feedback</a>
      </div>
    </div>
    <!-- Filter section (hidden) -->
    <div class="filter-section">
      <input type="text" 
             class="filter-input" 
             placeholder="Filter components..."
             id="component-filter"
             autocomplete="off">
    </div>
    <div id="settings-dropdown" class="settings-dropdown">
        <div class="settings-section">
          <div class="settings-section-title">Data Export</div>
          <button class="download-button" id="download-csv">
            <svg viewBox="0 0 16 16" fill="currentColor">
              <path d="M8 1.5a.5.5 0 01.5.5v6.793l2.146-2.147a.5.5 0 11.708.708l-3 3a.5.5 0 01-.708 0l-3-3a.5.5 0 11.708-.708L7.5 8.793V2a.5.5 0 01.5-.5zM2 12.5a.5.5 0 01.5-.5h11a.5.5 0 010 1h-11a.5.5 0 01-.5-.5z"/>
            </svg>
            Download Component Scores (CSV)
          </button>
          <button class="download-button" id="download-debug">
            <svg viewBox="0 0 16 16" fill="currentColor">
              <path d="M8 1l5 5v9H3V1h5zm-1 2H4v11h8V7H7V3z"/>
            </svg>
            Export Raw Data (JSON)
          </button>
        </div>

        <div class="settings-section">
          <div class="settings-section-title">Help & Feedback</div>
          <a href="https://github.com/dannyhope/Component-scorecard/issues" 
             class="bug-report-link" 
             target="_blank" 
             rel="noopener noreferrer">
            <svg viewBox="0 0 16 16" fill="currentColor">
              <path d="M8 9.5a1.5 1.5 0 100-3 1.5 1.5 0 000 3z"/>
              <path fill-rule="evenodd" d="M8 0a8 8 0 100 16A8 8 0 008 0zM1.5 8a6.5 6.5 0 1113 0 6.5 6.5 0 01-13 0z"/>
            </svg>
            View All Feedback
          </a>
          <a href="https://github.com/dannyhope/Component-scorecard/issues/new?template=bug_report.md&title=Feedback%3A+&labels=feedback&body=%23%23+Description%0A%0A%23%23+What+I+was+trying+to+do%0A%0A%23%23+What+happened%0A%0A%23%23+What+I+expected%0A%0A%23%23+Additional+context%0A-%20Figma+version%3A+%0A-%20Browser%3A+%0A-%20OS%3A+" 
             class="bug-report-link" 
             target="_blank" 
             rel="noopener noreferrer">
            <svg viewBox="0 0 16 16" fill="currentColor">
              <path d="M8 9.5a1.5 1.5 0 100-3 1.5 1.5 0 000 3z"/>
              <path fill-rule="evenodd" d="M8 0a8 8 0 100 16A8 8 0 008 0zM1.5 8a6.5 6.5 0 1113 0 6.5 6.5 0 01-13 0z"/>
            </svg>
            Submit Feedback
          </a>
        </div>
      </div>
    </div>

    <!-- Components List -->
    <div id="component-list" role="list" aria-label="Components"></div>

    <!-- Text area for custom checkboxes -->
    <div id="textarea-container">
      <label for="custom-rules" class="custom-heading">Define your checklist</label>
      <textarea id="custom-rules" aria-label="Checklist rules" aria-description="Enter component rules in Markdown format"></textarea>
    </div>
    
    <!-- Footer with Hide completed checkbox and other controls -->
    <div class="footer">
      <div class="footer-left">
        <label class="footer-checkbox">
          <input type="checkbox" id="hide-completed-checkbox">
          <span>Hide completed</span>
        </label>
      </div>
      <div class="footer-right">
        <a href="https://github.com/dannyhope/Component-scorecard/issues" target="_blank" class="settings-button" id="feedback-link" title="Submit Feedback">Feedback</a>
      </div>
    </div>

    <script>
      const defaultRules = `- [ ] Uses auto layout where appropriate
- [ ] Spaces are variables
- [ ] Any text uses text styles
- [ ] Fills and strokes are styles or variables
- [ ] WCAG2 AA contrast`;

      // Set the default content in the textarea
      document.getElementById('custom-rules').value = defaultRules;
      
      // Function to rebuild component list when rules change
      function rebuildComponentList() {
        // Don't rebuild if there are no components yet
        if (allComponents.length === 0) return;
        
        const componentList = document.getElementById('component-list');
        componentList.innerHTML = ''; // Clear existing list
        
        // Get the updated rules
        const rules = parseRules(document.getElementById('custom-rules').value);
        const totalRules = rules.totalRules;
        
        // Update totalCategories for all components
        allComponents = allComponents.map(component => ({
          ...component,
          totalCategories: totalRules
        }));
        
        // Rebuild component list with new rules
        buildComponentList(allComponents, checkboxStates, rules);
        updateComponentCount();
      }
      
      // Add debounced event listener to textarea for live updates
      let rebuildTimeout;
      document.getElementById('custom-rules').addEventListener('input', () => {
        clearTimeout(rebuildTimeout);
        rebuildTimeout = setTimeout(() => {
          saveCustomRules();
          rebuildComponentList();
        }, TIMING.STANDARD_DELAY + TIMING.SHORT_DELAY); // Debounce for 400ms
      });

      // Function to parse rules from the textarea
      function parseRules(text) {
        const lines = text.split('\n');
        let currentCategory = '';
        const rules = {};
        rules[currentCategory] = []; // Initialize default category for rules without headings
        let totalRules = 0;

        lines.forEach(line => {
          const trimmedLine = line.trim();
          if (trimmedLine.startsWith('- [ ]')) {
            // It's a checkbox item
            const ruleText = trimmedLine.substring(6).trim(); // Extract the rule text after "- [ ]"
            rules[currentCategory] = rules[currentCategory] || [];
            rules[currentCategory].push(ruleText);
            totalRules++;
          } else if (trimmedLine !== '') {
            // It's a heading - keep the full category name including any commas
            currentCategory = trimmedLine;
            rules[currentCategory] = rules[currentCategory] || [];
          }
        });

        rules.totalRules = totalRules; // Store total count
        return rules;
      }

      // Function to save custom rules to Figma client storage
      function saveCustomRules() {
        const customRules = document.getElementById('custom-rules').value;
        parent.postMessage({
          pluginMessage: {
            type: 'saveCustomRules',
            customRules: customRules
          }
        }, '*');
      }

      // Initialize global state
      let checkboxStates = {};
      const componentState = {};
      let viewStates = {}; // Store component view states
      let lastAutoExpandedId = null; // Track which component was last auto-expanded
      let allComponents = []; // Store all components for filtering

      // Update component count in UI
      function updateComponentCount() {
        const componentsNeedingCheck = allComponents.filter(component => {
          return component.checkedCount < component.totalCategories;
        });
        const count = componentsNeedingCheck.length;
        const countText = `${count} component${count !== 1 ? 's' : ''} need${count !== 1 ? '' : 's'} checking`;
        document.getElementById('component-count').textContent = countText;
      }

      // Keep track of which checkboxes should be hidden
      let hiddenCheckboxes = new Map(); // Map of componentId -> Set of checkboxIds
      
      // Function to filter components based on search text and hide completed
      function filterComponents(searchText = '', hideCompleted = false, forceApplyFilter = false) {
        console.log(`Filtering components: searchText=${searchText}, hideCompleted=${hideCompleted}, forceApplyFilter=${forceApplyFilter}`);
        const sections = document.querySelectorAll('.component-section');
        const now = new Date();
        
        // Handle filter application mode
        handleFilterMode(forceApplyFilter, hideCompleted, sections);
        
        // Prepare for filtering
        searchText = searchText.toLowerCase();
        const componentData = gatherComponentData(sections);
        
        // Track filter results
        let visibleCount = 0;
        let hiddenCount = 0;
        let hiddenDueToCompletion = 0;
        
        // Apply filters to each component
        for (const compData of componentData) {
          const result = applyFiltersToComponent(compData, searchText, hideCompleted, forceApplyFilter);
          
          if (result.isVisible) {
            visibleCount++;
          } else {
            hiddenCount++;
            if (result.hiddenDueToCompletion) {
              hiddenDueToCompletion++;
            }
          }
        }
        
        console.log(`Filter results: ${visibleCount} components visible, ${hiddenCount} hidden (${hiddenDueToCompletion} due to completion)`);
        
        // Update component count after filtering
        updateComponentCount();
      }
      
      // Helper function to handle filter mode (explicit application or normal interaction)
      function handleFilterMode(forceApplyFilter, hideCompleted, sections) {
        if (!forceApplyFilter) {
          console.log('Normal filtering during user interaction - components will not be hidden');
          return;
        }
        
        console.log('Filter is being explicitly applied (plugin load or checkbox toggle)');
        
        // If hide completed is turned off, clear the hidden checkboxes map and return
        if (!hideCompleted) {
          hiddenCheckboxes.clear();
          return;
        }
        
        // Find all checked checkboxes and mark them as hidden
        sections.forEach(section => {
          const componentId = section.getAttribute('data-id');
          if (!componentId) return;
          
          // Create a set for this component if it doesn't exist
          if (!hiddenCheckboxes.has(componentId)) {
            hiddenCheckboxes.set(componentId, new Set());
          }
          
          // Find all checked checkboxes in this component
          const checkboxes = section.querySelectorAll('input[type="checkbox"]');
          checkboxes.forEach(checkbox => {
            if (checkbox.checked && checkbox.id) {
              hiddenCheckboxes.get(componentId).add(checkbox.id);
            }
          });
        });
      }
        
      // Helper function to gather component data for filtering
      function gatherComponentData(sections) {
        const componentData = [];
        
        for (const section of sections) {
          const componentId = section.getAttribute('data-id');
          const component = allComponents.find(c => c.id === componentId);
          if (!component) continue;
          
          // Get all checkboxes for this component
          const checkboxes = section.querySelectorAll('input[type="checkbox"]');
          const totalRules = checkboxes.length;
          const checkedCount = Array.from(checkboxes).filter(cb => cb.checked).length;
          
          // Check if the component is expanded
          const isExpanded = !section.querySelector('.checkbox-group')?.classList.contains('hidden');
          
          // A component is fully complete only if ALL checkboxes are checked
          const isFullyComplete = totalRules > 0 && checkedCount === totalRules;
          
          componentData.push({
            id: componentId,
            name: component.name,
            element: section,
            checkedCount: checkedCount,
            totalRules: totalRules,
            isExpanded: isExpanded,
            isFullyComplete: isFullyComplete
          });
          
          // Debug output for this specific component
          console.log(`Component ${component.name}: checked=${checkedCount}, total=${totalRules}, expanded=${isExpanded}, fullyComplete=${isFullyComplete}`);
        }
        
        console.log('Component data:', componentData);
        
        // Specifically check for Example registration form (for debugging)
        debugRegistrationForm(componentData);
        
        return componentData;
      }
      
      // Helper function to debug the registration form component
      function debugRegistrationForm(componentData) {
        const registrationForm = componentData.find(c => c.name.includes('Example registration form'));
        if (!registrationForm) return;
        
        console.log('Registration form details:', registrationForm);
        
        // Check all checkboxes in this component
        const regFormSection = registrationForm.element;
        const checkboxes = regFormSection.querySelectorAll('input[type="checkbox"]');

      // Helper function to apply filters to a component
      function applyFiltersToComponent(compData, searchText, hideCompleted, forceApplyFilter) {
        const section = compData.element;
        const componentName = section.querySelector('.component-name').textContent.toLowerCase();
        
        // Check if component name matches search text
        const nameMatch = componentName.includes(searchText);
        
        // Check if component should be hidden based on completion
        const shouldHideBasedOnCompletion = shouldHideComponent(compData, hideCompleted, forceApplyFilter);
        
        // If either filter fails, hide the component and return early
        if (!nameMatch || shouldHideBasedOnCompletion) {
          section.style.display = 'none';
          return { 
            isVisible: false, 
            hiddenDueToCompletion: shouldHideBasedOnCompletion 
          };
        }
        
        // Component passed both filters, show it
        section.style.display = '';
        
        // Handle checkbox visibility if we're hiding completed items
        const hasVisibleCheckboxes = handleCheckboxVisibility(compData, hideCompleted, forceApplyFilter);
        
        // If no checkboxes are visible after filtering and component is expanded, hide it
        if (hideCompleted && compData.isExpanded && !hasVisibleCheckboxes) {
          console.log(`Hiding ${compData.name} because it has no visible checkboxes after filtering`);
          section.style.display = 'none';
          return { isVisible: false, hiddenDueToCompletion: true };
        }
        
        return { isVisible: true, hiddenDueToCompletion: false };
      }
      
      // Helper function to determine if a component should be hidden based on completion
      function shouldHideComponent(compData, hideCompleted, forceApplyFilter) {
        if (!hideCompleted) return false;
        if (!compData.isFullyComplete) {
          console.log(`Component ${compData.name}: Not fully complete (${compData.checkedCount}/${compData.totalRules}), showing it.`);
          return false;
        }
        
        // Component is fully complete, but only hide if explicitly applying filter
        if (forceApplyFilter) {
          console.log(`Component ${compData.name}: ALL criteria checked (${compData.checkedCount}/${compData.totalRules}), hiding component`);
          return true;
        } 
        
        console.log(`Component ${compData.name}: ALL criteria checked but not hiding during normal interaction`);
        return false;
      }
      
      // Helper function to handle checkbox visibility
      function handleCheckboxVisibility(compData, hideCompleted, forceApplyFilter) {
        if (!hideCompleted) {
          // Show all checkboxes if not hiding completed
          const checkboxLabels = compData.element.querySelectorAll('.checkbox-label');
          checkboxLabels.forEach(label => label.style.display = '');
          return true;
        }
        
        // Find all checkboxes in this component and hide the completed ones
        const checkboxLabels = compData.element.querySelectorAll('.checkbox-label');
        let visibleCheckboxes = 0;
        
        checkboxLabels.forEach(label => {
          const checkbox = label.querySelector('input[type="checkbox"]');
          if (!checkbox) return;
          
          if (checkbox.checked) {
            // Handle checked checkboxes
            if (shouldHideCheckbox(compData.id, checkbox.id, forceApplyFilter)) {
              label.style.display = 'none';
            } else {
              label.style.display = '';
              visibleCheckboxes++;
            }
          } else {
            // Always show unchecked checkboxes
            label.style.display = '';
            visibleCheckboxes++;
            
            // Remove from hidden set if it exists
            removeFromHiddenCheckboxes(compData.id, checkbox.id);
          }
        });
        
        return visibleCheckboxes > 0;
      }
      
      // Helper function to determine if a checkbox should be hidden
      function shouldHideCheckbox(componentId, checkboxId, forceApplyFilter) {
        if (forceApplyFilter) return true;
        
        return hiddenCheckboxes.has(componentId) && 
               checkboxId && 
               hiddenCheckboxes.get(componentId).has(checkboxId);
      }
      
      // Helper function to remove a checkbox from the hidden set
      function removeFromHiddenCheckboxes(componentId, checkboxId) {
        if (hiddenCheckboxes.has(componentId) && checkboxId) {
          hiddenCheckboxes.get(componentId).delete(checkboxId);
        }
      }

      // Helper function to format date for filename
      function formatDateForFilename(date) {
        const pad = (n) => n.toString().padStart(2, '0');
        return `${date.getFullYear()}-${pad(date.getMonth() + 1)}-${pad(date.getDate())}T${pad(date.getHours())}-${pad(date.getMinutes())}`;
      }

      // Helper function to sanitize filename
      function sanitizeFilename(name) {
        // Replace characters that are problematic in various filesystems
        // Windows: \ / : * ? " < > |
        // macOS: : /
        // Linux: /
        const sanitized = name
          .replace(/[\\/:\*\?"<>\|]/g, '-') // Replace Windows/Unix invalid chars
          .replace(/\s+/g, ' ')               // Collapse multiple spaces
          .trim();                           // Remove leading/trailing spaces
        
        return sanitized;
      }

      // Function to download data as JSON file
      function downloadJson(data, filename) {
        const json = JSON.stringify(data, null, 2);
        const blob = new Blob([json], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        
        link.setAttribute('href', url);
        link.setAttribute('download', filename);
        link.style.visibility = 'hidden';
        
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        URL.revokeObjectURL(url);
      }

      // Function to properly escape a field for CSV
      function escapeCSVField(field) {
        // Convert to string and handle null/undefined
        const str = field?.toString() || '';
        // If the field contains quotes, commas, or newlines, it needs to be quoted
        if (str.includes('"') || str.includes(',') || str.includes('\n')) {
          // Escape quotes by doubling them and wrap in quotes
          return `"${str.replace(/"/g, '""')}"`;
        }
        // If no special characters, return as is
        return str;
      }

      // Set up CSV download handler
      document.getElementById('download-csv').addEventListener('click', () => {
        // Get all checkboxes from the first component section (they all have the same structure)
        const firstComponent = document.querySelector('.component-section');
        if (!firstComponent) return; // No components to export

        const columns = [];
        
        // Get all category titles and their associated checkboxes
        firstComponent.querySelectorAll('.category-title').forEach(categoryTitle => {
          const category = categoryTitle.textContent;
          const checkboxGroup = categoryTitle.closest('.checkbox-group');

          checkboxGroup.querySelectorAll('.checkbox-label').forEach(label => {
            const checkbox = label.querySelector('input[type="checkbox"]');
            const ruleText = checkbox.getAttribute('data-rule');
            
            columns.push({
              // Create properly escaped header
              header: escapeCSVField(`${category} - ${ruleText}`),
              category: category,
              rule: ruleText,
              // Store the actual checkbox element for state verification
              checkbox: checkbox
            });
          });
        });

        // Create header row with escaped fields
        const headers = [
          escapeCSVField('Component Name'),
          escapeCSVField('Usage Count'),
          ...columns.map(col => col.header)
        ];
        const csvRows = [headers.join(',')];
        
        // Add a row for each component
        allComponents.forEach(component => {
          const row = [];
          
          // Add component name (properly escaped)
          row.push(escapeCSVField(component.name));
          
          // Add usage count
          row.push(escapeCSVField(component.usageCount));
          
          // Add checkmark symbols for each scoring criteria
          columns.forEach(({category, rule, checkbox}) => {
            // First check the actual checkbox state in the UI
            const uiChecked = checkbox.checked;
            // Then verify against stored state
            const storedState = checkboxStates[component.id]?.[category]?.[rule];
            // Use a checkmark if either the UI or stored state shows it's checked
            const isChecked = uiChecked || storedState?.checked === true;
            row.push(escapeCSVField(isChecked ? '✓' : ''));
          });
          
          csvRows.push(row.join(','));
        });

        // Create CSV content with UTF-8 BOM for Excel compatibility
        const csvContent = '\ufeff' + csvRows.join('\n');
        
        // Get document title from Figma for the filename
        parent.postMessage({
          pluginMessage: { type: 'getDocumentTitle' }
        }, '*');

        // Listen for the response with the document title
        const messageHandler = (event) => {
          if (event.data.pluginMessage && event.data.pluginMessage.type === 'documentTitle') {
            const docTitle = event.data.pluginMessage.title;
            const dateStr = formatDateForFilename(new Date());
            const filename = `${sanitizeFilename(docTitle)} component scorecards (${dateStr}).csv`;

            // Create and trigger download
            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');
            const url = URL.createObjectURL(blob);
            
            link.setAttribute('href', url);
            link.setAttribute('download', filename);
            link.style.visibility = 'hidden';
            
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(url); // Clean up the URL object

            // Clean up the event listener
            window.removeEventListener('message', messageHandler);
          }
        };

        window.addEventListener('message', messageHandler);
      });

      // Function to handle component selection
      function selectComponent(componentId, fromFigma = false) {
        console.log('Selecting component in UI:', componentId, 'fromFigma:', fromFigma);
        
        // Remove previous selection
        document.querySelectorAll('.component-section').forEach(section => {
          section.classList.remove('selected');
        });

        // If no component is selected (componentId is null), just clear selection
        if (!componentId) {
          console.log('No component ID provided, clearing selection');
          // Close the last auto-expanded component if it wasn't user-toggled
          if (lastAutoExpandedId && !componentState[lastAutoExpandedId].userToggled && !componentState[lastAutoExpandedId].collapsed) {
            componentState[lastAutoExpandedId].collapsed = true;
            toggleCollapse(lastAutoExpandedId);
          }
          lastAutoExpandedId = null;
          return;
        }

        // Find and highlight the selected component
        // Make sure we're using the component ID as a string for consistency
        const componentIdStr = String(componentId);
        console.log('Looking for component with ID:', componentIdStr);
        const section = document.querySelector(`[data-id="${componentIdStr}"]`);
        console.log('Found section for component:', section ? 'Yes' : 'No');
        
        if (section) {
          // Add selected class
          section.classList.add('selected');
          console.log('Added selected class to component section');

          // Close the last auto-expanded component if it wasn't user-toggled
          if (lastAutoExpandedId && lastAutoExpandedId !== componentId && 
              !componentState[lastAutoExpandedId].userToggled && 
              !componentState[lastAutoExpandedId].collapsed) {
            componentState[lastAutoExpandedId].collapsed = true;
            toggleCollapse(lastAutoExpandedId);
          }

          // Make sure the component state exists
          if (!componentState[componentId]) {
            console.log('Component state not found, initializing');
            componentState[componentId] = {
              collapsed: false,
              userToggled: false
            };
          }

          // Expand the newly selected component if it's collapsed
          if (componentState[componentId].collapsed) {
            console.log('Expanding collapsed component');
            componentState[componentId].collapsed = false;
            componentState[componentId].userToggled = false; // Mark as auto-expanded
            toggleCollapse(componentId);
            lastAutoExpandedId = componentId;
          }

          // Scroll the component into view
          section.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
          console.log('Scrolled component into view');
          
          // If this selection wasn't triggered by Figma, select the component in Figma
          if (!fromFigma) {
            console.log('Sending selectComponentInFigma message');
            parent.postMessage({ pluginMessage: { type: 'selectComponentInFigma', componentId } }, '*');
          }
        } else {
          console.log('Component section not found in the DOM. Available components:');
          document.querySelectorAll('.component-section').forEach(section => {
            console.log('Component ID:', section.getAttribute('data-id'));
          });
        }
      }

      // Function to escape HTML
      function escapeHtml(unsafe) {
        if (!unsafe) return '';
        return unsafe
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#039;");
      }

      // Function to determine score class based on percentage
      function getScoreClass(checkedCount, totalCategories) {
        const scorePercent = (checkedCount / totalCategories) * 100;
        if (scorePercent <= SCORE_THRESHOLDS.LOW) return 'score-red';
        if (scorePercent <= SCORE_THRESHOLDS.MEDIUM) return 'score-amber';
        return 'score-green';
      }

      // Function to get the least recent check date
      function getLeastRecentCheckDate(componentId, checkboxStates) {
        if (!checkboxStates[componentId]) return null;

        const timestamps = Object.values(checkboxStates[componentId])
          .flatMap(category => Object.values(category))
          .filter(state => state.checked && state.timestamp)
          .map(state => new Date(state.timestamp));
        
        if (timestamps.length === 0) return null;
        return new Date(Math.min(...timestamps));
      }

      // Function to setup component collapse/select behavior
      function setupComponentToggle(component, title, expandArrow) {
        // Function to handle toggle action
        const toggleAction = () => {
          // Toggle collapse state
          componentState[component.id].collapsed = !componentState[component.id].collapsed;
          componentState[component.id].userToggled = true; // Mark as user-toggled
          
          // Update visual state
          expandArrow.style.transform = componentState[component.id].collapsed ? 'rotate(-90deg)' : 'rotate(0)';
          toggleCollapse(component.id);
          
          // Update accessibility attributes
          title.setAttribute('aria-expanded', !componentState[component.id].collapsed);

          // Save view state to storage
          parent.postMessage({
            pluginMessage: {
              type: 'saveViewState',
              componentId: component.id,
              collapsed: componentState[component.id].collapsed,
              userToggled: true
            }
          }, '*');

          // Select in Figma
          parent.postMessage({ 
            pluginMessage: { 
              type: 'selectComponent',
              componentId: component.id 
            }
          }, '*');
        };
        
        // Add click handler
        title.onclick = toggleAction;
        
        // Add keyboard support
        title.addEventListener('keydown', (e) => {
          if (e.key === 'Enter' || e.key === ' ') {
            e.preventDefault();
            toggleAction();
          }
        });
      }

      // Function to handle checkbox state changes
      function handleCheckboxChange(component, checkbox, checkboxLabel, category, ruleText) {
        checkbox.onchange = () => {
          console.log(`Checkbox changed for ${component.name}, category: ${category}, rule: ${ruleText}, checked: ${checkbox.checked}`);
          const timestamp = checkbox.checked ? new Date() : null;
          const timestampSpan = checkboxLabel.querySelector('.checkbox-timestamp');
          
          if (timestampSpan) {
            timestampSpan.textContent = checkbox.checked ? formatDate(timestamp) : '';
          }
          
          // Update local state
          if (!checkboxStates[component.id]) {
            checkboxStates[component.id] = {};
          }
          if (!checkboxStates[component.id][category]) {
            checkboxStates[component.id][category] = {};
          }
          
          checkboxStates[component.id][category][ruleText] = {
            checked: checkbox.checked,
            timestamp: timestamp ? timestamp.toISOString() : null
          };
          
          // Count checked items for this component
          const checkedCount = Object.values(checkboxStates[component.id])
            .flatMap(categoryState => Object.values(categoryState))
            .filter(state => state && state.checked === true).length;
          
          console.log(`${component.name}: ${checkedCount} items checked`);
          
          // Update the score
          updateScore(component.id, checkedCount);
          
          // When a checkbox is checked, we need to track if it should be hidden
          // but we don't actually hide it until the filter is applied
          if (checkbox.checked && document.getElementById('hide-completed-checkbox').checked) {
            // If Hide completed is active, add this checkbox to the hidden map
            // but don't actually hide it yet
            const componentId = component.id;
            if (!hiddenCheckboxes.has(componentId)) {
              hiddenCheckboxes.set(componentId, new Set());
            }
            if (checkbox.id) {
              // Don't add the checkbox we just clicked
              // This ensures it stays visible until the filter is toggled
              // hiddenCheckboxes.get(componentId).add(checkbox.id);
            }
            
            // Make sure all OTHER checked checkboxes in this component stay hidden
            const section = checkboxLabel.closest('.component-section');
            if (section) {
              const allCheckboxLabels = section.querySelectorAll('.checkbox-label');
              allCheckboxLabels.forEach(label => {
                if (label !== checkboxLabel) { // Don't hide the one we just clicked
                  const cb = label.querySelector('input[type="checkbox"]');
                  if (cb && cb.checked && cb.id) {
                    // Keep other checked checkboxes hidden if they're in our map
                    if (hiddenCheckboxes.get(componentId).has(cb.id)) {
                      label.style.display = 'none';
                    }
                  }
                }
              });
            }
          } else if (!checkbox.checked) {
            // If a checkbox is unchecked, remove it from the hidden map
            const componentId = component.id;
            if (hiddenCheckboxes.has(componentId) && checkbox.id) {
              hiddenCheckboxes.get(componentId).delete(checkbox.id);
            }
          }
          
          // Send message to update state
          parent.postMessage({ 
            pluginMessage: { 
              type: 'checkboxChanged', 
              componentId: component.id, 
              category, 
              label: ruleText, 
              isChecked: checkbox.checked,
              timestamp: timestamp ? timestamp.toISOString() : null
            } 
          }, '*');
          
          // Update modification indicator after checkbox change
          setTimeout(() => updateModificationIndicator(component.id), TIMING.SHORT_DELAY); // Small delay to ensure state is updated
        };
      }

      // Function to create a checkbox item
      function createCheckboxItem(component, category, ruleText, checkboxStates) {
        const checkboxLabel = document.createElement('label');
        const checkbox = document.createElement('input');
        checkbox.type = 'checkbox';
        
        // Generate a unique ID for the checkbox for accessibility
        const checkboxId = `checkbox-${component.id}-${category.replace(/\s+/g, '-')}-${ruleText.replace(/\s+/g, '-')}`;
        checkbox.id = checkboxId;

        // Set checkbox state from saved state
        checkbox.checked = checkboxStates[component.id]
          && checkboxStates[component.id][category]
          && checkboxStates[component.id][category][ruleText]
          && checkboxStates[component.id][category][ruleText].checked || false;

        // Add data attributes for finding the checkbox later
        checkbox.setAttribute('data-category', category);
        checkbox.setAttribute('data-rule', ruleText);
        checkbox.setAttribute('aria-label', `${ruleText} for ${component.name}`);
        
        // Set up change handler
        handleCheckboxChange(component, checkbox, checkboxLabel, category, ruleText);

        checkboxLabel.className = 'checkbox-label';
        checkboxLabel.setAttribute('for', checkboxId);
        checkboxLabel.appendChild(checkbox);
        
        const textSpan = document.createElement('span');
        textSpan.textContent = ruleText;
        checkboxLabel.appendChild(textSpan);

        // Add timestamp span with accessibility improvements
        const timestampSpan = document.createElement('span');
        timestampSpan.className = 'checkbox-timestamp';
        
        // Set initial timestamp if exists
        const state = checkboxStates[component.id]?.[category]?.[ruleText];
        if (state?.checked && state?.timestamp) {
            const date = new Date(state.timestamp);
            const formattedDate = formatDate(date);
            timestampSpan.textContent = formattedDate;
            timestampSpan.setAttribute('aria-label', `Last checked ${formattedDate}`);
        } else {
            timestampSpan.setAttribute('aria-hidden', 'true');
        }
        checkboxLabel.appendChild(timestampSpan);
        
        // Add right-click handler for context menu
        setupContextMenu(checkboxLabel, category, ruleText);
        
        return checkboxLabel;
      }

      // Function to set up context menu for a checkbox label
      function setupContextMenu(checkboxLabel, category, ruleText) {
        checkboxLabel.addEventListener('contextmenu', (e) => {
          e.preventDefault();
          const menu = document.getElementById('context-menu');
          menu.style.display = 'block';
          menu.style.left = `${e.pageX}px`;
          menu.style.top = `${e.pageY}px`;
          
          // Store the clicked item's info for the context menu
          menu.dataset.category = category;
          menu.dataset.ruleText = ruleText;
        });
      }

      // Function to create rule categories with checkboxes
      function createRuleCategories(component, rules, checkboxStates) {
        const container = document.createElement('div');
        container.className = 'checkbox-group';
        container.id = `component-content-${component.id}`;
        container.setAttribute('role', 'region');
        container.setAttribute('aria-labelledby', `component-title-${component.id}`);
        
        // Check if component should be collapsed based on saved state
        const isCollapsed = componentState[component.id]?.collapsed || false;
        if (isCollapsed) {
          container.classList.add('hidden');
        }
        
        // Process rules by category
        for (let category in rules) {
          // Skip internal property
          if (category === 'totalRules') continue;
          
          // Create category container with proper heading
          const categoryContainer = document.createElement('div');
          categoryContainer.className = 'category-container';
          categoryContainer.setAttribute('data-category', category);
          
          // Create unique ID for the category
          const categoryId = `category-${component.id}-${category.replace(/\s+/g, '-')}`;
          categoryContainer.id = categoryId;
          
          const categoryTitle = document.createElement('div');
          categoryTitle.className = 'category-title';
          categoryTitle.id = `${categoryId}-title`;
          categoryTitle.setAttribute('role', 'heading');
          categoryTitle.setAttribute('aria-level', '3');
          categoryTitle.textContent = category;
          categoryContainer.appendChild(categoryTitle);
          
          // Create fieldset for related checkboxes
          const fieldset = document.createElement('div');
          fieldset.setAttribute('role', 'group');
          fieldset.setAttribute('aria-labelledby', `${categoryId}-title`);
          
          // Create checkboxes for each rule in this category
          rules[category].forEach(ruleText => {
            const checkboxLabel = createCheckboxItem(component, category, ruleText, checkboxStates);
            fieldset.appendChild(checkboxLabel);
          });
          
          categoryContainer.appendChild(fieldset);
          container.appendChild(categoryContainer);
        }
        
        return container;
      }

      // Main function to build the component list
      function buildComponentList(components, checkboxStates, rules) {
        const componentList = document.getElementById('component-list');
        
        components.forEach((component, index) => {
          // Create component section
          const section = document.createElement('div');
          section.className = 'component-section';
          section.setAttribute('data-id', String(component.id));
          section.setAttribute('role', 'listitem');
          section.setAttribute('aria-label', `${component.name} component`);

          // Initialize component state using saved view state if available
          const savedViewState = viewStates[component.id];
          componentState[component.id] = { 
            collapsed: savedViewState ? savedViewState.collapsed : index !== 0,
            userToggled: savedViewState ? savedViewState.userToggled : false
          };

          // Get score class and dates for indicators
          const scoreClass = getScoreClass(component.checkedCount, component.totalCategories);
          const lastModifiedDate = component.lastModified ? new Date(component.lastModified) : null;
          const leastRecentCheckDate = getLeastRecentCheckDate(component.id, checkboxStates);
          
          // Create the component title elements
          const { title, expandArrow } = createComponentTitle(
            component, 
            componentState[component.id].collapsed, 
            scoreClass, 
            lastModifiedDate, 
            leastRecentCheckDate
          );
          
          // Set up title click event for collapse/expand
          setupComponentToggle(component, title, expandArrow);
          
          // Add title to section
          section.appendChild(title);
          
          // Create and add checkbox groups for rules
          const checkboxGroup = createRuleCategories(component, rules, checkboxStates);
          section.appendChild(checkboxGroup);
          
          // Add the component section to the list
          componentList.appendChild(section);
        });
      }
      
      // Listen for messages from the plugin code
      window.onmessage = event => {
        const message = event.data.pluginMessage;
        if (!message) return;
        
        // Load user preferences if available
        if (message.userPreferences) {
          const hideCompletedCheckbox = document.getElementById('hide-completed-checkbox');
          if (hideCompletedCheckbox && message.userPreferences.hideCompleted !== undefined) {
            hideCompletedCheckbox.checked = message.userPreferences.hideCompleted;
            
            // Update the label text based on the preference
            const hideCompletedLabel = document.querySelector('.footer-checkbox span');
            if (hideCompletedLabel) {
              hideCompletedLabel.textContent = message.userPreferences.hideCompleted ? 'Hide completed' : 'Hide completed';
            }
            
            // Apply the filter if hide completed is checked
            if (message.userPreferences.hideCompleted) {
              setTimeout(() => {
                // Pass true for forceApplyFilter to ensure items are hidden when plugin loads
                filterComponents(document.getElementById('component-filter').value, true, true);
              }, TIMING.SHORT_DELAY); // Small delay to ensure UI is ready
            }
          }
        }

        // Load custom rules if available
        if (message.customRules) {
          document.getElementById('custom-rules').value = message.customRules;
          // Rebuild component list with the loaded rules
          rebuildComponentList();
        }

        if (message.type === 'loadError') {
          console.error('Error loading components:', message.error);
          // Show error message in the UI
          const componentList = document.getElementById('component-list');
          componentList.innerHTML = `
            <div class="error-message">
              <h3>Error loading components</h3>
              <p>${message.error}</p>
              <p>Try refreshing the plugin or restarting Figma.</p>
              <button id="retry-button" class="primary-button">Retry</button>
            </div>
          `;
          
          // Add retry button handler
          document.getElementById('retry-button').addEventListener('click', () => {
            // Show loading state
            const refreshButton = document.getElementById('refresh-button');
            refreshButton.innerHTML = `<svg viewBox="0 0 16 16" fill="currentColor" class="spin">
              <path d="M8 3a5 5 0 11-4.546 2.914.5.5 0 01-.908-.417A6 6 0 108 2v1z"/>
              <path d="M8 4.466V.534a.25.25 0 00-.41-.192L5.23 2.308a.25.25 0 000 .384l2.36 1.966A.25.25 0 008 4.466z"/>
            </svg>`;
            
            // Send message to the plugin to refresh components
            parent.postMessage({ pluginMessage: { type: 'refreshComponents' } }, '*');
          });
        } else if (message.type === 'loadComponents') {
          // Store the component data
          const components = message.components;
          checkboxStates = message.checkboxStates || {};
          viewStates = message.viewStates || {};
          allComponents = components;
          
          // Build the component list
          const componentList = document.getElementById('component-list');
          componentList.innerHTML = ''; // Clear existing list
          
          // Get the custom rules from the textarea and parse them
          const rules = parseRules(document.getElementById('custom-rules').value);
          
          // Build the component list
          buildComponentList(components, checkboxStates, rules);
          
          // Update component count
          updateComponentCount();
          
          // If a component is selected in Figma, select it in the UI
          if (message.selectedComponentId) {
            selectComponent(message.selectedComponentId, true);
          }
          
          // Hide the loading indicator
          document.getElementById('refresh-button').classList.remove('spin');
        } else if (message.type === 'updateScore') {
          // Update the score for a component
          const component = allComponents.find(c => c.id === message.componentId);
          if (component) {
            component.checkedCount = message.checkedCount;
            component.totalCategories = message.totalRules;
            updateScore(message.componentId, message.checkedCount);
            updateComponentCount(); // Refresh the component count
          }
        } else if (message.type === 'documentTitle') {
          // Update the document title
          document.getElementById('document-title').textContent = message.title;
        } else if (message.type === 'componentSelected') {
          // A component was selected in Figma
          console.log('Component selected in Figma:', message.componentId);
          if (message.componentId) {
            // Select the component in the UI (with fromFigma=true to prevent infinite loop)
            selectComponent(message.componentId, true);
          } else {
            // Clear selection
            selectComponent(null);
          }
        }
      };

      // Handle context menu actions
      document.getElementById('apply-to-all').addEventListener('click', () => {
        const menu = document.getElementById('context-menu');
        const category = menu.dataset.category;
        const ruleText = menu.dataset.ruleText;

        // Apply to all components
        const now = new Date();
        allComponents.forEach(component => {
          // Update the UI checkbox
          const componentSection = document.querySelector(`[data-id="${component.id}"]`);
          if (componentSection) {
            const checkbox = componentSection.querySelector(`input[type="checkbox"][data-category="${category}"][data-rule="${ruleText}"]`);
            if (checkbox) {
              checkbox.checked = true;
              // Update timestamp
              const label = checkbox.closest('.checkbox-label');
              if (label) {
                const timestampSpan = label.querySelector('.checkbox-timestamp');
                if (timestampSpan) {
                  timestampSpan.textContent = formatDate(now);
                }
              }
            }
          }

          // Send message to update the plugin state
          parent.postMessage({
            pluginMessage: {
              type: 'checkboxChanged',
              componentId: component.id,
              category: category,
              label: ruleText,
              isChecked: true,
              applyToAll: true,
              timestamp: now.toISOString()
            }
          }, '*');
          
          // Update modification indicator after applying to all
          setTimeout(() => updateModificationIndicator(component.id), TIMING.SHORT_DELAY); // Small delay to ensure state is updated
        });

        // Hide the menu
        menu.style.display = 'none';
      });

      // Hide context menu when clicking outside
      document.addEventListener('click', (e) => {
        const menu = document.getElementById('context-menu');
        if (!menu.contains(e.target)) {
          menu.style.display = 'none';
        }
      });

      // Function to toggle the collapsed state of a component
      function toggleCollapse(componentId) {
        const checkboxGroup = document.querySelector(`#component-list div[data-id="${componentId}"] .checkbox-group`);
        if (checkboxGroup) {
          checkboxGroup.classList.toggle('hidden');
        }
      }

      // Function to format date in a friendly way
      function formatDate(date) {
        const now = new Date();
        const diffMs = now - date;
        const diffMins = Math.floor(diffMs / 60000);
        const diffHours = Math.floor(diffMins / 60);
        const diffDays = Math.floor(diffHours / 24);

        if (diffMins < 1) return 'just now';
        if (diffMins < 60) return `${diffMins}m ago`;
        if (diffHours < 24) return `${diffHours}h ago`;
        if (diffDays < 7) return `${diffDays}d ago`;

        return date.toLocaleDateString();
      }

      // Function to check if component needs modification indicator
      function updateModificationIndicator(componentId) {
        const component = allComponents.find(c => c.id === componentId);
        if (!component) return;

        const lastModifiedDate = component.lastModified ? new Date(component.lastModified) : null;
        
        // Find the least recent checkbox timestamp
        let leastRecentCheckDate = null;
        if (checkboxStates[componentId]) {
          const timestamps = Object.values(checkboxStates[componentId])
            .flatMap(category => Object.values(category))
            .filter(state => state.checked && state.timestamp)
            .map(state => new Date(state.timestamp));
          if (timestamps.length > 0) {
            leastRecentCheckDate = new Date(Math.min(...timestamps));
          }
        }
        
        // Show red dot if component was modified more recently than least recent check
        const showModifiedIndicator = lastModifiedDate && leastRecentCheckDate && 
          lastModifiedDate > leastRecentCheckDate;

        // Update the UI
        const componentSection = document.querySelector(`[data-id="${componentId}"]`);
        if (componentSection) {
          const existingDot = componentSection.querySelector('.modified-indicator');
          const nameSpan = componentSection.querySelector('.component-name');
          
          if (showModifiedIndicator && !existingDot) {
            const dot = document.createElement('span');
            dot.className = 'modified-indicator';
            nameSpan.insertBefore(dot, nameSpan.firstChild);
          } else if (!showModifiedIndicator && existingDot) {
            existingDot.remove();
          }
        }
      }

      // Function to dynamically update score and score colour
      function updateScore(componentId, checkedCount) {
        if (!window.domCache) window.domCache = {};
        if (!window.domCache[componentId]) {
          window.domCache[componentId] = document.querySelector(`[data-id='${componentId}'] .component-name`);
        }
        const nameSpan = window.domCache[componentId];
        if (nameSpan) {
          // Find the component in our stored array to get its total
          const component = allComponents.find(c => c.id === componentId);
          if (!component) return;

          // Update the component's checked count
          component.checkedCount = checkedCount;

          const scorePercent = (checkedCount / component.totalCategories) * 100;
          let scoreClass = '';
          if (scorePercent <= SCORE_THRESHOLDS.LOW) scoreClass = 'score-red';
          else if (scorePercent <= SCORE_THRESHOLDS.MEDIUM) scoreClass = 'score-amber';
          else scoreClass = 'score-green';

          // Get all the elements after the score span
          const elements = nameSpan.innerHTML.split('</span>');
          const modifiedIndicator = elements[0].includes('modified-indicator') ? elements[0] + '</span>' : '';
          const lastModified = elements[2] ? elements[2] + '</span>' : '';
          const usageCount = elements[3] ? elements[3] + '</span>' : '';
          
          // Update with new score but preserve other elements
          nameSpan.innerHTML = `${modifiedIndicator}${component.name} <span class="${scoreClass}" style="display: none !important;">(${checkedCount}/${component.totalCategories})</span>${lastModified}${usageCount}`;
          
          // If hide completed is checked, apply the filter
          if (document.getElementById('hide-completed-checkbox').checked) {
            const searchText = document.getElementById('component-filter').value;
            filterComponents(searchText, true);
          }
        }

        // Update component count since the checked status changed
        updateComponentCount();
      }

      function selectInstances(componentId) {
        parent.postMessage({ 
          pluginMessage: { 
            type: 'selectInstances',
            componentId: componentId
          }
        }, '*');
      }
    </script>
  </body>
</html>
